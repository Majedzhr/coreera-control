<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoreEra Control | Console preview</title>

<style>
:root{--navy:#0B1F3A;--blue:#1D6FE0;--sky:#38C6F4;--bg:#F4F6FA;--line:#E1E6EE;--soft:#EEF1F5;--slate:#5B6474;--ok:#137A52;--okbg:#E3F6EE;--warn:#8A5A0B;--warnbg:#FDF1DC;--bad:#B4361D;--card:#fff;--text:#0B1F3A;--tint:#EEF3FC;--hover:#F7F9FC;--infobg:#E6EFFD;--info:#1556B5;--map:#E9EFF7}
html[data-theme=dark]{--bg:#071226;--card:#0E1E38;--line:#1E3354;--soft:#17294A;--text:#E6EDF7;--slate:#9FB0C8;--tint:#16315C;--hover:#122746;--okbg:rgba(34,176,125,.16);--ok:#5FD6A8;--warnbg:rgba(232,162,58,.16);--warn:#F2C27A;--bad:#FF8A70;--infobg:rgba(91,155,255,.16);--info:#9CC2FF;--map:#10264A;--navy:#0A1830;color-scheme:dark}
html[data-theme=dark] .side,html[data-theme=dark] .lside,html[data-theme=dark] .wiz .wl{background:#050E1F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.5 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif}
a{color:var(--blue)}
button,input,select{font:inherit}
.disp{font-family:'Space Grotesk',sans-serif}
html[lang=ar] .disp,html[lang=ar] h1,html[lang=ar] h2{font-family:'IBM Plex Sans Arabic',sans-serif}
.ltr{direction:ltr;unicode-bidi:isolate}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* login */
.login{min-height:100vh;display:flex;flex-wrap:wrap}
.lside{flex:1 1 420px;background:var(--navy);color:#fff;padding:48px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;gap:40px}
.lside:before{content:"";position:absolute;width:600px;height:600px;inset-inline-end:-200px;bottom:-200px;background:radial-gradient(circle,rgba(29,111,224,.5),transparent 65%);filter:blur(30px)}
.lside:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:48px 48px}
.lside>*{position:relative;z-index:1}
.lside h1{font:700 clamp(32px,4vw,48px)/1.15 'Space Grotesk',sans-serif;margin:0 0 14px;letter-spacing:-.02em}
html[lang=ar] .lside h1{letter-spacing:0}
.lside p{color:#A9B8CE;max-width:440px;margin:0}
.feat{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.feat span{font-size:13px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);color:#D5DFEE}
.lform{flex:1 1 420px;display:flex;align-items:center;justify-content:center;padding:48px 24px;position:relative}
.lbox{width:100%;max-width:400px;display:flex;flex-direction:column;gap:16px}
.lbox h2{margin:0;font:700 26px 'Space Grotesk',sans-serif}
.field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--slate)}
.field input,.field select{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 14px;font-size:15px;color:var(--text);background:var(--card);width:100%}
.field input:focus,.field select:focus{outline:2px solid var(--blue);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:#C3CCDA}
.btn.pri{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.pri:hover{background:#1863cc}
.btn.full{width:100%;height:48px;font-size:15px}
.btn.danger{color:var(--bad);border-color:#F2C9C0}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.langbtn{position:absolute;top:20px;inset-inline-end:24px;height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font:600 14px 'IBM Plex Sans Arabic',Inter,sans-serif;cursor:pointer;color:var(--text)}

/* app */
.app{min-height:100vh;display:flex;flex-wrap:wrap}
.side{flex:1 1 240px;background:var(--navy);padding:22px 14px;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;color:#fff;font:700 17px 'Space Grotesk',sans-serif}
.brand em{font-style:normal;font-weight:400;color:#5B9BFF}
.cmdk{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:10px;margin:0 2px 14px;padding:0 12px;height:40px;border-radius:10px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#8DA1C0;font-size:13px;cursor:pointer}
.cmdk:hover{background:rgba(255,255,255,.1)}
.cmdk span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cmdk kbd{white-space:nowrap;margin-inline-start:auto;font:600 11px Inter,sans-serif;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.1);color:#C3D0E3}
.gl{padding:14px 12px 4px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#6F83A3}
html[lang=ar] .gl{letter-spacing:0}
.nav{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:14px;color:#A9B8CE;cursor:pointer}
.nav:hover{background:rgba(255,255,255,.06);color:#fff}
.nav.on{background:rgba(29,111,224,.25);color:#fff}
.nav:focus-visible,.cmdk:focus-visible{outline:2px solid #5B9BFF}
.nav svg{width:18px;height:18px;flex:none}
.nav .cnt{margin-inline-start:auto;font-size:11px;font-weight:700;background:#D2452B;color:#fff;border-radius:999px;padding:1px 7px}
.me{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:auto;padding:14px 6px 0;border-top:1px solid rgba(255,255,255,.08);color:#fff;font-size:13px}
.av{width:34px;height:34px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:600;flex:none;color:#fff}
.me small{display:block;color:#8DA1C0;font-size:12px}
.mini{all:unset;color:#8DA1C0;cursor:pointer;font-size:12px;white-space:nowrap;padding:4px 6px;border-radius:6px}
.mini:hover{color:#fff;background:rgba(255,255,255,.08)}
.main{flex:999 1 560px;min-width:0;padding:28px 36px 90px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px}
.head h1{margin:0;font:700 28px 'Space Grotesk',sans-serif}
.sub{font-size:14px;color:var(--slate)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.nw{flex-wrap:nowrap}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 14px;height:44px;flex:1 1 260px;color:var(--slate)}
.search input{border:0;outline:none;background:transparent;flex:1;font-size:14px;color:var(--text);min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.g2>*,.g3>*,.g4>*{min-width:0}
.span2{grid-column:span 2}
.pad{padding:20px}
.card h2,.dark h2{margin:0 0 12px;font-size:16px}
.kpi span{font-size:13px;color:var(--slate)}
.kpi b{display:block;font:700 30px 'Space Grotesk',sans-serif;margin:4px 0}
.kpi i{font-style:normal;font-size:12px;font-weight:600}
.chip{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.c-ok{background:var(--okbg);color:var(--ok)}.c-warn{background:var(--warnbg);color:var(--warn)}.c-off{background:var(--soft);color:#4A5568}.c-info{background:var(--infobg);color:var(--info)}
.bar{height:6px;border-radius:6px;background:var(--soft);overflow:hidden;flex:1}
.bar i{display:block;height:100%;border-radius:6px}
.tbl{overflow-x:auto}
.tr{display:grid;gap:12px;align-items:center;padding:12px 20px;border-bottom:1px solid var(--soft);font-size:14px}
.th{font-size:12px;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;padding-top:14px;padding-bottom:14px}
html[lang=ar] .th{letter-spacing:0}
.tr.link{cursor:pointer}.tr.link:hover{background:var(--hover)}.tr.sel{background:var(--tint)}
.cb{all:unset;width:18px;height:18px;border:1.5px solid #C3CCDA;border-radius:5px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff;background:var(--card)}
.cb[aria-checked=true]{background:var(--blue);border-color:var(--blue)}
.cb:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.pill{height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:13px;font-weight:500;cursor:pointer}
.pill.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:6px}
.list>div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--soft);font-size:14px}
.list>div:last-child{border-bottom:0}
.muted{color:var(--slate)}
.ic{width:34px;height:34px;border-radius:9px;background:var(--tint);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);z-index:80;display:flex;align-items:center;gap:10px;padding:12px 18px;border-radius:12px;background:var(--navy);color:#fff;font-size:14px;font-weight:500;box-shadow:0 20px 40px rgba(11,31,58,.3);animation:up .35s cubic-bezier(.16,1,.3,1)}
.toast i{width:22px;height:22px;border-radius:50%;background:#22B07D;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:12px}
@keyframes up{from{opacity:0;transform:translate(-50%,12px)}}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{height:44px;padding:0 14px;border:0;background:transparent;font-size:14px;font-weight:600;color:var(--slate);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--blue);border-bottom-color:var(--blue)}
.dark{background:var(--navy);color:#fff;border-radius:16px}
.sw{flex:none;width:46px;height:26px;border-radius:999px;border:0;background:#C3CCDA;position:relative;cursor:pointer}
.sw:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:inset-inline-start .2s}
.sw[aria-pressed=true]{background:var(--blue)}.sw[aria-pressed=true]:after{inset-inline-start:23px}
.opt{text-align:start;border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:14px;cursor:pointer;color:var(--text);display:flex;flex-direction:column;gap:4px}
.opt.on{border-color:var(--blue);background:var(--tint)}
.opt b{font-size:14px}.opt span{font-size:12px;color:var(--slate)}
.phone{border-radius:26px;border:7px solid #1B3358;padding:16px 12px}
.demo{position:fixed;bottom:16px;inset-inline-end:16px;background:var(--navy);color:#fff;font-size:12px;padding:8px 12px;border-radius:999px;opacity:.85;z-index:40}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--soft)}
.alert:last-child{border-bottom:0}
.alert .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.check{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:14px}
.check .ck{width:24px;height:24px;border-radius:50%;border:2px solid #C3CCDA;display:flex;align-items:center;justify-content:center;flex:none;font-size:12px;color:#fff}
.check.done .ck{background:#22B07D;border-color:#22B07D}
.check.done span:last-child{color:var(--slate);text-decoration:line-through}

/* bulk bar */
.bulk{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;background:var(--navy);color:#fff;padding:10px 12px;border-radius:16px;box-shadow:0 20px 50px rgba(11,31,58,.35);max-width:calc(100% - 32px);animation:up .35s cubic-bezier(.16,1,.3,1)}
.bulk b{padding:0 10px;font-size:14px}
.bulk .btn{height:38px;background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:#fff;font-size:13px}
.bulk .btn:hover{background:rgba(255,255,255,.16)}
.bulk select{height:38px;border-radius:10px;border:1px solid rgba(255,255,255,.14);background:#12305A;color:#fff;padding:0 10px;font-size:13px}

/* overlays */
.ov{position:fixed;inset:0;z-index:90;background:rgba(5,14,31,.55);backdrop-filter:blur(4px);display:flex;align-items:flex-start;justify-content:center;padding:10vh 16px 16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.pal{width:100%;max-width:620px;background:var(--card);color:var(--text);border-radius:18px;box-shadow:0 40px 80px rgba(0,0,0,.35);overflow:hidden}
.pal .in{display:flex;align-items:center;gap:10px;padding:0 18px;height:60px;border-bottom:1px solid var(--line);color:var(--slate)}
.pal input{flex:1;border:0;outline:none;font-size:17px;color:var(--text);background:transparent;min-width:0}
.pal ul{list-style:none;margin:0;padding:8px;max-height:52vh;overflow:auto}
.pal li button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font-size:14px;cursor:pointer}
.pal li button:hover,.pal li button.act{background:var(--tint)}
.pal li small{margin-inline-start:auto;color:var(--slate);font-size:12px}
.pal .grp{padding:10px 12px 4px;font-size:11px;font-weight:600;color:var(--slate);text-transform:uppercase;letter-spacing:.06em}
.wiz{width:100%;max-width:720px;background:var(--card);color:var(--text);border-radius:20px;box-shadow:0 40px 80px rgba(0,0,0,.35);overflow:hidden;display:flex;flex-wrap:wrap}
.wiz .wl{flex:1 1 220px;background:var(--navy);color:#fff;padding:28px 24px;display:flex;flex-direction:column;gap:6px}
.wiz .wr{flex:999 1 340px;padding:28px;display:flex;flex-direction:column;gap:16px;min-height:420px}
.ws{display:flex;align-items:center;gap:12px;padding:10px 0;font-size:14px;color:#8DA1C0}
.ws .n{width:26px;height:26px;border-radius:50%;border:1.5px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex:none}
.ws.on{color:#fff}.ws.on .n{background:var(--blue);border-color:var(--blue)}
.ws.done .n{background:#22B07D;border-color:#22B07D;color:#fff}
.prog{height:6px;border-radius:6px;background:var(--soft);overflow:hidden}
.prog i{display:block;height:100%;background:var(--blue);transition:width .4s}

@media (max-width:1000px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr}.span2{grid-column:auto}}
@media (max-width:640px){.main{padding:20px 16px 110px}.g4,.g2{grid-template-columns:1fr}.lside{padding:32px 24px}.side{flex-direction:row;flex-wrap:wrap}.brand{width:100%;padding-bottom:10px}.cmdk{width:100%}.me{width:100%}.wiz .wl{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

</section>
<div id="layer"></div>
<div id="toastbox" aria-live="polite"></div>
<div class="demo" id="demo" aria-hidden="true"></div>
